<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Mango con Crema!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="menu">
    <div class="eyebrow">FRESCO · CREMOSO · DELICIOSO</div>
    <h1>¡Mango <span>con Crema!</span></h1>
    <p class="subtitle">Un antojo dulce para disfrutar en cualquier momento.</p>

    <section class="product" aria-label="Mango con crema de 267 mililitros">
      <div class="fruit-art" aria-hidden="true">
        <div class="mango mango-back"></div>
        <div class="mango mango-front"></div>
        <div class="cup">
          <div class="cream"></div>
          <div class="mango-cubes">◆ ◆<br>◆ ◆ ◆</div>
        </div>
        <div class="leaf"></div>
      </div>
      <div class="details">
        <span class="tag">TAMAÑO PERSONAL</span>
        <h2>Mango con crema</h2>
        <p class="size">267 ml</p>
        <p class="description">Mango dulce con una textura suave y cremosa.</p>
        <div class="purchase">
          <strong class="price">$12.000 <small>COP</small></strong>
          <button id="orderButton" type="button">¡Lo quiero!</button>
        </div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </div>
    </section>
    <footer>Un momento dulce, cucharada a cucharada 🥭</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
